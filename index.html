<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéPass</title>
</head>

<body>
    <header class="big_title">
        <h1>🎬CinéPass</h1>
        <p>Inscription Au Club De Cinéma - Saison 2026</p>
    </header>
    <main>
        <div class="caption">
            <p>💡Rejoingnez notre club et profitez de tarifs réduits, d'avants-premières exclusives et de rencontres
                avec des realisateurs !
            </p>
        </div>
        <form>
            <section class="infos_perso">
                <h2>👤 Informations Personelles</h2>

                <div class="info_prenom"> <label>Prénom :</label>
                    <input type="text" id="prenom">
                </div>

                <div class="info_nom"><label>Nom :</label>
                    <input type="text" id="nom">
                </div>

                <div class="info_email">
                    <label>Adresse Mail</label>
                    <input type="text" id="email">
                </div>

                <div class="info_mdp">
                    <label>Mot De Passe</label>
                    <input type="text" id="mdp">
                </div>

                <div class="info_tel">
                    <label>Numéro De Teléphone</label>
                    <input type="text" id="tel">
                </div>
                <div class="info_birthdate">
                    <label>Date De Naissance</label>
                    <input type="date" id="birthdate">
                </div>
            </section>


        </form>



    </main>
</body>

</html>
